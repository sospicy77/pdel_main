<title>취약성 평가 흐름도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 연구 보고서형 단일 컬럼. 숫자는 고정폭, 효과 방향은 적(위험↑)·청(위험↓) 발산 쌍 */
:root {
  --bg: #f7f8f6; --surface: #ffffff; --fg: #1b1f1c; --muted: #5a625c; --line: #dde2dc;
  --accent: #2f6b3f; --accent-soft: #e5efe7;
  --up: #d23f3e; --down: #2a78d6; --flat: #9aa29c;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141715; --surface: #1c201d; --fg: #e9ece9; --muted: #a3aba5; --line: #323833;
  --accent: #7cc08d; --accent-soft: #223127;
  --up: #e66767; --down: #3987e5; --flat: #6f7771;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141715; --surface: #1c201d; --fg: #e9ece9; --muted: #a3aba5; --line: #323833;
  --accent: #7cc08d; --accent-soft: #223127;
  --up: #e66767; --down: #3987e5; --flat: #6f7771;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: grid; gap: 6px; padding-bottom: 24px; border-bottom: 2px solid var(--fg); }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
h1 { font-size: 30px; line-height: 1.3; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
h2 { font-size: 21px; margin: 0; text-wrap: balance; display: flex; gap: 10px; align-items: baseline; }
h2 .no { font-family: var(--f-mono); font-size: 14px; color: var(--accent); }
h3 { font-size: 16px; margin: 8px 0 0; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 40px; }
p { margin: 0; max-width: 68ch; }
.note { font-size: 13px; color: var(--muted); }
ul.key { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }
b.up { color: var(--up); } b.down { color: var(--down); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.stat .v { font-family: var(--f-mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12.5px; color: var(--muted); }
.callout { background: var(--accent-soft); border-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; }
table.num td { font-variant-numeric: tabular-nums; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 8px; min-width: 0; overflow-x: auto; }
figcaption { font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; min-width: 520px; height: auto; display: block; }
.chart.small { min-width: 0; }
.chart text { font-family: var(--f-body); fill: var(--fg); }
.chart .tick { font-size: 11px; fill: var(--muted); font-family: var(--f-mono); }
.chart .lab { font-size: 12px; }
.chart .lab.strong { font-weight: 700; }
.chart .val { font-size: 11.5px; fill: var(--muted); font-family: var(--f-mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hit { fill: transparent; }
.chart .mark:hover .hit { fill: var(--accent-soft); }
.bar.up, .pt.up, .pt2.up { fill: var(--up); } .bar.down, .pt.down, .pt2.down { fill: var(--down); } .bar.flat, .pt.flat { fill: var(--flat); }
.pt2 { opacity: .75; stroke: var(--surface); stroke-width: 1; }
.ci { stroke-width: 2; } .ci.up { stroke: var(--up); } .ci.down { stroke: var(--down); } .ci.flat { stroke: var(--flat); }
.line { fill: none; stroke-width: 2; } .line.s1 { stroke: var(--s1); } .line.s2 { stroke: var(--s2); } .line.s3 { stroke: var(--s3); }
.dot { stroke: var(--surface); stroke-width: 2; } .dot.s1 { fill: var(--s1); } .dot.s2 { fill: var(--s2); } .dot.s3 { fill: var(--s3); }
.deps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.dep { padding: 8px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }
code { font-family: var(--f-mono); font-size: 12.5px; background: var(--accent-soft); padding: 1px 5px; border-radius: 3px; }
pre { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 0; }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
</style>
<style>
:root { --fam1: #2a78d6; --fam2: #1baf7a; --fam3: #eb6834; --fam4: #c98500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fam1: #3987e5; --fam2: #199e70; --fam3: #d95926; --fam4: #eda100; } }
:root[data-theme="dark"] { --fam1: #3987e5; --fam2: #199e70; --fam3: #d95926; --fam4: #eda100; }
.bar.f1 { fill: var(--fam1); } .bar.f2 { fill: var(--fam2); } .bar.f3 { fill: var(--fam3); } .bar.f4 { fill: var(--fam4); }
</style>
<style>.vf svg { width: 100%; min-width: 640px; height: auto; display: block; }</style>
<div class="wrap"><header><div class="eyebrow">고추탄저병 설문 · 취약성 평가</div><h1>취약성 평가 흐름도</h1><p class="sub">발생 모델링부터 변수 선정, 취약성 모형, 활용까지 · 단계별 ML / 통계 / 설계 구분</p></header>
<section>

 정의</text><text x="186" y="111" font-size="11" style="fill:var(--muted)">피해도 임계값 0–3% × 분류 모델, CV AUC 비교</text><text x="186" y="125" font-size="11" style="fill:var(--muted)">가장 잘 구분되는 3%를 발생으로 정의</text><rect x="532" y="79" width="30" height="17" rx="8.5" style="fill:var(--accent)"/><text x="547.0" y="91.5" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">ML</text><line x1="360.0" y1="130" x2="360.0" y2="160" stroke="currentColor" stroke-width="1.2" marker-end="url(#va)"/><text x="372.0" y="150.0" font-size="11" font-weight="600">발생 라벨 (40 / 101)</text><rect x="150" y="162" width="420" height="60" rx="6" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.5"/><circle cx="168" cy="182" r="10" style="fill:var(--accent)"/><text x="168" y="186" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">2</text><text x="186" y="186" font-size="13" font-weight="700">발생 모델링</text><text x="186" y="203" font-size="11" style="fill:var(--muted)">선택법 4종 × 모델 6종 × 변수 수 k</text><text x="186" y="217" font-size="11" style="fill:var(--muted)">변수 선택은 fold 안 · nested CV로 성능 확인</text><rect x="532" y="171" width="30" height="17" rx="8.5" style="fill:var(--accent)"/><text x="547.0" y="183.5" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">ML</text><line x1="360.0" y1="222" x2="360.0" y2="252" stroke="currentColor" stroke-width="1.2" marker-end="url(#va)"/><text x="372.0" y="242.0" font-size="11" font-weight="600">예측 신호 확인 (AUC ≈ 0.79–0.81)</text><rect x="150" y="254" width="420" height="60" rx="6" style="fill:var(--accent-soft);stroke:var(--accent)" stroke-width="1.5"/><circle cx="168" cy="274" r="10" style="fill:var(--accent)"/><text x="168" y="278" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">3</text><text x="186" y="278" font-size="13" font-weight="700">변수 중요도</text><text x="186" y="295" font-size="11" style="fill:var(--muted)">SHAP: 중요 변수와 위험 방향</text><text x="186" y="309" font-size="11" style="fill:var(--muted)">안정성 선택: 변수별 근거 강도</text><rect x="532" y="263" width="30" height="17" rx="8.5" style="fill:var(--accent)"/><text x="547.0" y="275.5" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">ML</text><line x1="360.0" y1="314" x2="360.0" y2="344" stroke="currentColor" stroke-width="1.2" marker-end="url(#va)"/><text x="372.0" y="334.0" font-size="11" font-weight="600">중요 변수 · 방향 · 빈도</text><rect x="150" y="346" width="420" height="60" rx="6" style="fill:var(--surface);stroke:var(--muted)" stroke-width="1" stroke-dasharray="4 3"/><circle cx="168" cy="366" r="10" style="fill:var(--muted)"/><text x="168" y="370" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">4</text><text x="186" y="370" font-size="13" font-weight="700">역할 지정 (E · S · A)</text><text x="186" y="387" font-size="11" style="fill:var(--muted)">E 노출값 · S 작년 발생·연작·인근 고추밭 (+규모 보정)</text><text x="186" y="401" font-size="11" style="fill:var(--muted)">A 후보: 농가가 바꿀 수 있는 관행만</text><rect x="532" y="355" width="30" height="17" rx="8.5" style="fill:var(--muted)"/><text x="547.0" y="367.5" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">설계</text><line x1="360.0" y1="406" x2="360.0" y2="436" stroke="currentColor" stroke-width="1.2" marker-end="url(#va)"/><text x="372.0" y="426.0" font-size="11" font-weight="600">적응력 후보 관행</text><rect x="150" y="438" width="420" height="60" rx="6" style="fill:var(--surface);stroke:var(--muted)" stroke-width="1"/><circle cx="168" cy="458" r="10" style="fill:var(--muted)"/><text x="168" y="462" text-anchor="middle" font-size="10.5" font-weight="700" style="fill:var(--surface)">5</text><text x="186" y="462" font-size="13" font-weight="700">적응력 변수 선정</text><text x="186" y="479" font-size="11" style="fill:var(--muted)">후보 조합 9개를 같은 취약성 모형에 넣어 비교</text><text x="186" y="493" font-size="11" style="fill:var(--muted)">CV AUC
